<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Host Portal – StayNorthBengal</title>
  <link rel="stylesheet" href="/host/host.css" />
</head>
<body>
  <div class="container">
    <h1>Host Dashboard</h1>
    <p class="subtitle">Lightweight interface for low‑bandwidth regions</p>
    <form id="availability-form">
      <label for="date">Date</label>
      <input type="date" id="date" required />

      <label for="available">Available Slots</label>
      <input type="number" id="available" min="0" value="0" required />

      <button type="submit">Update Availability</button>
    </form>
    <div id="status" class="status"></div>
  </div>

  <script src="host.js"></script>
</body>
</html>
