<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Host Portal – StayNorthBengal</title>
  <link rel="stylesheet" href="host.css" />
</head>
<body>
  <main class="container">
    <h1 class="title">Host Dashboard</h1>
    <p class="subtitle">Low‑bandwidth friendly interface</p>
    <form id="availability-form" class="form">
      <label for="date">Date</label>
      <input type="date" id="date" required />

      <label for="slots">Available Slots</label>
      <input type="number" id="slots" min="0" value="0" required />

      <button type="submit" class="btn">Update</button>
    </form>
    <div id="status" class="status"></div>
  </main>

  <script src="host.js"></script>
</body>
</html>
